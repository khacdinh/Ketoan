<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kế Toán Công Trình</title>
  <link rel="icon" type="image/png" href="img/logo-dien-thuy-hinh.png">
  <link rel="preload" href="vendor/fonts/barlow-vietnamese-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/lucide/icons.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="app-sidebar no-print">
    <!-- Logo công ty + tên phần mềm + tên đơn vị (đặt ở Cài đặt). Thu gọn (Ctrl B) hoặc cửa sổ hẹp: chỉ còn hình và ô mã 2 chữ. -->
    <div class="side-brand">
      <span class="brand-mark"><img src="img/logo-dien-thuy-hinh.png" alt="Điền Thủy" width="229" height="215"></span>
      <div class="brand-text">
        <div class="brand-name">Kế Toán Công Trình</div>
        <div id="org-name" class="brand-org"></div>
      </div>
    </div>
    <nav id="nav" aria-label="Chức năng"></nav>
    <div class="side-foot">
      <div class="full">Tồn quỹ hiện tại</div>
      <div id="side-fund"></div>
      <div id="save-state" class="full" aria-live="polite"></div>
      <button type="button" id="side-toggle" class="side-toggle" title="Thu gọn / mở rộng menu (Ctrl B)" aria-label="Thu gọn menu"><i class="ph ph-panel-left" aria-hidden="true"></i><span class="label">Thu gọn menu Ctrl B</span></button>
    </div>
  </aside>

  <main class="app-main min-h-screen">
    <div id="offline-root"></div>
    <header class="topbar no-print">
      <button type="button" class="tb-field tb-ct" id="tb-ct" aria-haspopup="listbox" aria-label="Chọn công trình" title="Chọn công trình: áp dụng cho mọi sổ và báo cáo">
        <span class="lbl">Công trình</span><b id="tb-ct-val">Tất cả công trình</b><i class="ph ph-chevron-down" aria-hidden="true"></i>
      </button>
      <button type="button" class="tb-field tb-search" id="tb-search" aria-label="Tìm toàn cục (Ctrl K)" title="Tìm phiếu, NCC, vật tư, số tiền (Ctrl K)">
        <i class="ph ph-search" aria-hidden="true"></i><span class="min-w-0 flex-1 truncate text-left">Tìm phiếu, NCC, vật tư, số tiền…</span><kbd>Ctrl K</kbd>
      </button>
      <div class="flex-1"></div>
      <button type="button" class="btn btn-primary" id="btn-phieu" title="Nhập phiếu chi phí (F2)"><i class="ph ph-plus" aria-hidden="true"></i>Nhập phiếu chi phí<kbd>F2</kbd></button>
      <button type="button" class="btn btn-secondary" id="btn-new" title="Ghi thu / chi (F3)"><i class="ph ph-plus" aria-hidden="true"></i>Ghi thu / chi<kbd>F3</kbd></button>
      <div class="tb-user"><div id="user-root"></div></div>
    </header>
    <div class="page-head">
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><h1 id="page-title" class="page-title">Đang tải</h1><span id="page-tags" class="flex flex-wrap items-center gap-2"></span></div>
        <p id="page-sub" class="page-sub"></p>
      </div>
      <div id="page-actions" class="no-print flex flex-wrap items-center gap-2">
        <span id="page-actions-view" class="contents"></span>
        <button type="button" class="btn btn-secondary" id="btn-export">
          <i class="ph ph-file-spreadsheet" aria-hidden="true"></i>Xuất Excel<i class="ph ph-chevron-down" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div id="view" class="view flex flex-col gap-4 pt-3">
      <div class="py-24 text-center text-ink-3">Đang tải dữ liệu</div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="auth-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="print-root"></div>

  <script src="js/shared.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
