<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kế Toán Công Trình</title>
  <link rel="icon" type="image/png" href="img/logo-dien-thuy-hinh.png">
  <link rel="preload" href="vendor/fonts/archivo-vietnamese-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/phosphor/icons.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="app-sidebar no-print max-lg:w-16">
    <!-- Logo công ty. Màn cao: logo đầy đủ trên thẻ trắng (chữ xanh đậm của logo không đọc được trên nền xanh bìa sổ).
         Màn thấp (laptop 1366×768): hình ngôi nhà cạnh tên phần mềm, gọn như cũ để menu không phải cuộn. Thanh thu gọn: chỉ hình. -->
    <div class="side-brand">
      <div class="brand-card"><img src="img/logo-dien-thuy.png" alt="Điền Thủy — Architecture &amp; Furniture" width="298" height="295"></div>
      <div class="brand-row">
        <span class="brand-mark"><img src="img/logo-dien-thuy-hinh.png" alt="Điền Thủy" width="229" height="215"></span>
        <div class="brand-text min-w-0">
          <div class="text-[16px] leading-tight font-bold text-white font-stretch-[110%]">Kế Toán Công Trình</div>
          <div id="org-name" class="mt-0.5 text-[11.5px] leading-snug text-cover-ink-2"></div>
        </div>
      </div>
    </div>
    <nav id="nav" aria-label="Chức năng" class="flex-1 overflow-y-auto py-1"></nav>
    <div class="side-foot border-t border-white/10 px-5 py-4 max-lg:hidden">
      <div id="side-fund"></div>
      <div id="save-state" class="mt-1 text-[12px] text-cover-ink-2" aria-live="polite"></div>
    </div>
  </aside>

  <main class="app-main min-h-screen max-lg:ml-16">
    <div id="offline-root"></div>
    <header class="topbar sticky top-0 z-10 flex flex-wrap items-end gap-x-6 gap-y-3 bg-paper/95 px-8 pt-6 pb-4 backdrop-blur max-md:px-4">
      <div class="min-w-0 flex-1">
        <h1 id="page-title" class="text-[26px] leading-tight font-semibold tracking-[-0.015em] font-stretch-[112%]">Đang tải</h1>
        <p id="page-sub" class="mt-1 text-[13.5px] text-ink-3"></p>
      </div>
      <div class="no-print flex items-center gap-2">
        <div id="user-root"></div>
        <button type="button" class="btn btn-primary" id="btn-new" title="Phím tắt F2">
          <i class="ph ph-plus" aria-hidden="true"></i>Ghi thu / chi<kbd class="ml-0.5 border-white/30 bg-white/10 text-white/85 max-xl:hidden">F2</kbd>
        </button>
        <button type="button" class="btn btn-secondary" id="btn-export">
          <i class="ph ph-file-xls" aria-hidden="true"></i>Xuất Excel<i class="ph ph-caret-down -mr-1 text-[13px] text-ink-3" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <div id="view" class="view flex flex-col gap-5 px-8 pt-3 pb-14 max-md:px-4">
      <div class="py-24 text-center text-ink-3">Đang tải dữ liệu</div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="auth-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="print-root"></div>

  <script src="js/shared.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
